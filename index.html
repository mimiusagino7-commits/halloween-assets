<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>魔女の小さなハロウィン展示</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09060c;color:#f5e7d1;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}body{min-height:100svh;display:grid;place-items:center;padding:12px}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:wait}button:focus-visible{outline:3px solid #f5d787;outline-offset:5px}[hidden]{display:none!important}
.stage{position:relative;isolation:isolate;overflow:hidden;width:min(100%,480px,calc((100svh - 24px)*9/16));aspect-ratio:9/16;container-type:inline-size;background:#000;border:1px solid #574160;border-radius:24px;box-shadow:0 0 60px #49215740}
.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:10% 7%;text-align:center}.eyebrow{font-size:clamp(10px,2.9cqi,14px);letter-spacing:.19em;color:#c3a276;margin:0}.heading{font-family:serif;font-weight:500;letter-spacing:.04em;line-height:1.55;font-size:clamp(23px,7.6cqi,38px);margin:6% 0 0}.small{color:#ccb9da;font-size:clamp(12px,3.6cqi,17px);line-height:1.8}.action{position:relative;border:1px solid #a57cbf;border-radius:100px;background:#24152f;color:#ffefd5;padding:12px 24px;min-height:46px;font-size:clamp(13px,3.9cqi,18px);box-shadow:0 0 22px #b16de21a}.action:hover{background:#3a234b}.action:disabled{opacity:.55}.welcome .heading{margin-top:12%}.welcome .action{position:absolute;bottom:11%}.welcome .welcome-copy{position:absolute;bottom:20%;margin:0;font-size:clamp(13px,4cqi,18px)}
.witch{position:absolute;left:0;right:0;top:36%;animation:witchFloat 6s ease-in-out infinite}.witch-clip{position:relative;overflow:hidden;width:100%;aspect-ratio:729/352}.witch-clip img{position:absolute;width:210.7%;max-width:none;height:auto;left:-3.292%;top:-21.023%}.witch-glow{position:absolute;inset:-18% 15%;z-index:-1;background:radial-gradient(ellipse,#55216d40,transparent 70%)}.welcome .ornament{position:absolute;bottom:5%;font-size:clamp(12px,3cqi,15px);color:#a68b60;letter-spacing:.8em}
.choices{justify-content:center}.choices .heading{font-size:clamp(23px,7cqi,35px);margin-top:4%}.choices .small{margin:4% 0 8%}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;width:100%}.card{padding:0;border:0;color:#f5e7d1;background:transparent;animation:cardFloat 5.8s ease-in-out infinite;animation-delay:var(--delay)}.card img{width:100%;aspect-ratio:1;object-fit:contain;display:block;border-radius:9px;border:1px solid #c6a8d7;box-shadow:0 0 16px #b65bdd38;background:#faf2df;transition:box-shadow .2s}.card:hover img,.card:focus-visible img{box-shadow:0 0 24px #ca80e894}.card span{display:block;font-size:clamp(12px,3.6cqi,17px);padding-top:9px;letter-spacing:.04em}.card:disabled{cursor:default}.choices .hint{font-size:clamp(11px,3.2cqi,15px);margin-top:9%;color:#baa1c8}
.curtain{position:absolute;z-index:8;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .65s ease}.stage[data-phase="darkening"] .curtain{opacity:1;pointer-events:auto}.spell{justify-content:center}.laugh{margin:0;color:#dfbced;text-shadow:0 0 22px #c565ec;font-family:serif;font-size:clamp(26px,9cqi,44px);letter-spacing:.12em;animation:laughAppear 1s ease both}.spell-fade{opacity:0;transition:opacity .4s ease}
.gift .eyebrow{margin-top:8%}.gift .heading{margin-top:8%}.gift .small{margin-top:3%;color:#d9c5e6}.gift-sender{font-weight:700;color:#f5d787}.gift #gift-copy{margin-bottom:3%}.gift-treat{margin:0;color:#f5d787;font-size:clamp(14px,4.4cqi,21px);font-weight:600;letter-spacing:.06em}.hand{position:absolute;width:144%;max-width:none;right:-30%;top:34%;transform:translateX(115%);opacity:0;transition:transform 2.7s cubic-bezier(.22,.6,.3,1),opacity 1.2s ease;pointer-events:none}.stage[data-phase="gift"] .hand{transform:translateX(0);opacity:1}.gift .action{position:absolute;bottom:7%;opacity:0;pointer-events:none;transition:opacity .4s}.stage[data-phase="gift-ready"] .hand{transform:translateX(0);opacity:1}.stage[data-phase="gift-ready"] .gift .action{opacity:1;pointer-events:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.error{padding:20px;color:#f5d787}
@keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes witchFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes laughAppear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.card,.witch,.laugh{animation:none}.curtain,.hand,.gift .action,.spell-fade{transition-duration:.01s}}

.candy-rain{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.falling-treat{position:absolute;top:-12%;left:var(--x);width:var(--size);aspect-ratio:1;opacity:0;filter:drop-shadow(0 2px 4px #0008);animation:treatFall var(--duration) var(--delay) linear both;will-change:transform,opacity}
.falling-treat svg{width:100%;height:100%;display:block}
.falling-treat.ghost{animation-name:ghostFall}
.gift .eyebrow,.gift .heading,.gift .small,.gift-treat{position:relative;z-index:3}
.gift .action{z-index:3}
@keyframes treatFall{0%{opacity:0;transform:translate3d(0,0,0) rotate(var(--turn))}8%{opacity:.9}80%{opacity:.9}100%{opacity:0;transform:translate3d(var(--drift),195cqi,0) rotate(calc(var(--turn) + 240deg))}}
@keyframes ghostFall{0%{opacity:0;transform:translate3d(0,0,0) rotate(var(--turn))}12%{opacity:.85}38%{opacity:.85}52%{opacity:.12}64%{opacity:.7}85%{opacity:.6}100%{opacity:0;transform:translate3d(var(--drift),195cqi,0) rotate(calc(var(--turn) + 160deg))}}
@media(prefers-reduced-motion:reduce){.candy-rain{display:none}}
</style>
</head>
<body>
<main class="stage" id="stage" data-phase="welcome" aria-label="魔女の小さなハロウィン展示">
 <section class="view welcome" id="welcome" aria-labelledby="welcome-title">
  <p class="eyebrow">HALLOWEEN EXHIBITION</p>
  <h1 class="heading" id="welcome-title">ようこそ、ようこそ。</h1>
  <div class="witch"><div class="witch-glow"></div><div class="witch-clip"><img src="./witch-welcome.png" alt="赤い巻き髪と紫の帽子の魔女" decoding="async"></div></div>
  <p class="welcome-copy">お菓子をひとつ、いかが？</p>
  <button class="action" id="start" type="button" disabled>準備中…</button>
  <div class="ornament" aria-hidden="true">✦ ☽ ✦</div>
 </section>
 <section class="view choices" id="choices" aria-labelledby="choices-title" hidden inert>
  <p class="eyebrow">CHOOSE YOUR FAVORITE</p>
  <h2 class="heading" id="choices-title">お好きな子を、ひとり。</h2>
  <p class="small">気になる絵をタップしてね。</p>
  <div class="gallery">
   <button class="card" type="button" data-child="witch" style="--delay:-.8s" aria-label="かぼちゃの魔女を選ぶ"><img src="./pumpkin-witch.jpg" alt="" decoding="async"><span>かぼちゃの魔女</span></button>
   <button class="card" type="button" data-child="ghost" style="--delay:-3s" aria-label="おばけちゃんを選ぶ"><img src="./ghost.jpg" alt="" decoding="async"><span>おばけちゃん</span></button>
   <button class="card" type="button" data-child="vampire" style="--delay:-1.8s" aria-label="吸血鬼ちゃんを選ぶ"><img src="./vampire.jpg" alt="" decoding="async"><span>吸血鬼ちゃん</span></button>
   <button class="card" type="button" data-child="zombie" style="--delay:-4s" aria-label="ゾンビちゃんを選ぶ"><img src="./zombie.jpg" alt="" decoding="async"><span>ゾンビちゃん</span></button>
  </div>
  <p class="hint">どの子も、あなたを待っているよ。</p>
 </section>
 <section class="view spell" id="spell" aria-label="魔女の笑い声" hidden inert><p class="laugh">イヒヒヒヒ</p></section>
 <section class="view gift" id="gift" aria-labelledby="gift-title" hidden inert>
  <div class="candy-rain" id="candy-rain" aria-hidden="true"></div>
  <p class="eyebrow">A LITTLE TREAT FOR YOU</p>
  <h2 class="heading" id="gift-title">お菓子、どうぞ♬</h2>
  <p class="small" id="gift-copy"><strong class="gift-sender" id="gift-sender"></strong>、あなたへ。</p>
  <p class="gift-treat" id="gift-treat"></p>
  <img class="hand" id="gift-hand" alt="" decoding="async">
  <button class="action" id="again" type="button">もう一度選ぶ</button>
 </section>
 <div class="curtain" aria-hidden="true"></div>
 <p id="status" class="sr-only" role="status" aria-live="polite"></p>
 <noscript><p class="error">この展示を楽しむには、JavaScriptを有効にしてください。</p></noscript>
</main>
<script>
(() => {
 'use strict';
 const stage=document.getElementById('stage');
 const views=['welcome','choices','spell','gift'].map(id=>document.getElementById(id));
 const start=document.getElementById('start');
 const again=document.getElementById('again');
 const spell=document.getElementById('spell');
 const status=document.getElementById('status');
 const copy=document.getElementById('gift-sender');
 const hand=document.getElementById('gift-hand');
 const treatName=document.getElementById('gift-treat');
 const rain=document.getElementById('candy-rain');
 const cards=Array.from(document.querySelectorAll('.card'));
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const names={witch:'かぼちゃの魔女',ghost:'おばけちゃん',vampire:'吸血鬼ちゃん',zombie:'ゾンビちゃん'};
 const treats={
  witch:{src:'./treat-witch.png',label:'かぼちゃクッキー'},
  ghost:{src:'./treat-ghost.png',label:'消えるマシュマロ'},
  vampire:{src:'./treat-vampire.png',label:'鉄分キャンディ'},
  zombie:{src:'./treat-zombie.png',label:'目玉グミ'}
 };

 const candyArt={
  witch:`<path fill="#b56d29" stroke="#f4c677" stroke-width="2" d="M20 11Q10 7 7 19Q1 36 10 45Q17 51 25 47Q34 50 41 44Q50 35 43 20Q39 8 29 11Z"/><path d="M24 11Q22 5 29 3" fill="none" stroke="#80874a" stroke-width="5"/><path d="M21 14Q13 29 20 45M29 14Q37 28 30 45" fill="none" stroke="#804a24" stroke-width="2"/><path fill="#3e242b" d="M13 25l6-6 3 7zm17 1 3-7 6 6zM23 31l3-5 3 5zM13 34q12 13 26-1l-4 8-5-1-5 5-5-4-4 1z"/>`,
  ghost:`<path d="M12 12Q25 4 39 12L41 37Q25 48 10 37Z" fill="#fff2dd" stroke="#d8c5d8" stroke-width="2"/><ellipse cx="25" cy="12" rx="13" ry="6" fill="#fffaf0"/><path d="M14 35Q26 40 38 34" fill="none" stroke="#e1ced8" stroke-width="2"/><ellipse cx="20" cy="23" rx="2" ry="3" fill="#68516e"/><ellipse cx="31" cy="23" rx="2" ry="3" fill="#68516e"/><path d="M23 30q3 3 6-1" fill="none" stroke="#68516e" stroke-width="1.5"/>`,
  vampire:`<path d="M14 16 3 11l2 15-2 14 12-7M36 16l11-5-2 15 2 14-12-7" fill="#ac4772" stroke="#e3b273" stroke-width="1.5"/><path d="M5 16l7 6M5 34l7-5M45 16l-7 6M45 34l-7-5" fill="none" stroke="#e4b680" stroke-width="1.5"/><ellipse cx="25" cy="25" rx="15" ry="15" fill="#672543" stroke="#e5b97e" stroke-width="2"/><ellipse cx="21" cy="19" rx="7" ry="4" fill="#e0859d" opacity=".65"/><path d="M23 22l2-5 2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3z" fill="#e4ba78"/>`,
  zombie:`<circle cx="25" cy="25" r="21" fill="#f5ead7" stroke="#cfb8c8" stroke-width="2"/><circle cx="25" cy="25" r="13" fill="IRIS"/><path d="M25 13v7m0 10v7M13 25h7m10 0h7m-20-8 5 5m6 6 5 5m0-16-5 5m-6 6-5 5" stroke="#fff8d5" stroke-width="1" opacity=".65"/><circle cx="25" cy="25" r="6.5" fill="#0b1420"/><circle cx="28" cy="21" r="3" fill="#fff"/><circle cx="15" cy="36" r="1.6" fill="#fff"/>`
 };
 let rainTimer;
 function clearRain(){clearTimeout(rainTimer);rain.replaceChildren();}
 function rainTreats(child){
  clearRain();
  if(reduced)return;
  for(let i=0;i<16;i++){
   const particle=document.createElement('span');
   particle.className='falling-treat '+child;
   particle.dataset.treat=child;
   particle.style.setProperty('--x',(4+((i*37)%87))+'%');
   particle.style.setProperty('--size',(6+(i%4)*1.2)+'%');
   particle.style.setProperty('--duration',(4.8+(i%5)*.42)+'s');
   particle.style.setProperty('--delay',(i*.13)+'s');
   particle.style.setProperty('--turn',(i*47-90)+'deg');
   particle.style.setProperty('--drift',((i%2?1:-1)*(3+i%4))+'cqi');
   const art=candyArt[child].replace('IRIS',i%2?'#39baa7':'#a744c0');
   particle.innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" focusable="false" aria-hidden="true">'+art+'</svg>';
   rain.appendChild(particle);
  }
  rainTimer=setTimeout(clearRain,9500);
 }
 let busy=false;
 const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 function show(id,phase){
  views.forEach(view=>{const active=view.id===id;view.hidden=!active;view.inert=!active;});
  stage.dataset.phase=phase||id;
 }
 function chooseScreen(){
  clearRain();
  busy=false;
  cards.forEach(card=>{card.disabled=false;});
  spell.classList.remove('spell-fade');
  show('choices');
  status.textContent='４枚の絵から、お好きな子を選んでください。';
  cards[0].focus({preventScroll:true});
 }
 async function choose(card){
  if(busy||stage.dataset.phase!=='choices')return;
  busy=true;
  cards.forEach(item=>{item.disabled=true;});
  again.disabled=true;
  const name=names[card.dataset.child];
  copy.textContent=name+'から';
  const treat=treats[card.dataset.child];
  hand.src=treat.src;
  treatName.textContent=treat.label;
  hand.alt='紫の袖の魔女の手が、'+treat.label+'を差し出している';
  stage.dataset.phase='darkening';
  status.textContent=name+'を選びました。';
  await pause(reduced?80:700);
  show('spell');
  status.textContent='イヒヒヒヒ。';
  await pause(reduced?700:1400);
  spell.classList.add('spell-fade');
  await pause(reduced?50:450);
  show('gift','gift-enter');
  await pause(40);
  stage.dataset.phase='gift';
  rainTreats(card.dataset.child);
  status.textContent=name+'から、'+treat.label+'をどうぞ。';
  await pause(reduced?120:2800);
  stage.dataset.phase='gift-ready';
  again.disabled=false;
  again.focus({preventScroll:true});
 }
 start.addEventListener('click',chooseScreen);
 cards.forEach(card=>card.addEventListener('click',()=>choose(card)));
 again.addEventListener('click',()=>{if(stage.dataset.phase==='gift-ready')chooseScreen();});
 const giftImages=Object.values(treats).map(treat=>{const img=new Image();img.src=treat.src;return img;});
 Promise.all([...Array.from(document.images).filter(img=>img!==hand),...giftImages].map(img=>{
  if(img.decode)return img.decode();
  if(img.complete&&img.naturalWidth)return Promise.resolve();
  return new Promise((resolve,reject)=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',reject,{once:true});});
 })).then(()=>{start.disabled=false;start.textContent='展示をのぞく';status.textContent='展示の準備ができました。';})
 .catch(()=>{start.textContent='画像を読み込めませんでした';status.textContent='画像を読み込めませんでした。ページを開き直してください。';});
})();
</script>
</body>
</html>
